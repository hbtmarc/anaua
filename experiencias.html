<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Experiências — Anauá Ecoturismo</title>
  <meta name="description" content="Trilhas, expedições, eventos kids e muito mais. Encontre sua próxima aventura na natureza com a Anauá Ecoturismo." />
  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Anauá Ecoturismo" />
  <meta property="og:url"         content="https://www.anaua.com.br/experiencias.html" />
  <meta property="og:title"       content="Experiências — Anauá Ecoturismo" />
  <meta property="og:description" content="Trilhas, expedições, eventos kids e muito mais. Encontre sua próxima aventura na natureza." />
  <meta property="og:image"       content="https://www.anaua.com.br/assets/img/og-experiencias.jpg" />
  <meta property="og:locale"      content="pt_BR" />
  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="Experiências — Anauá Ecoturismo" />
  <meta name="twitter:image"       content="https://www.anaua.com.br/assets/img/og-experiencias.jpg" />
  <!-- Canonical -->
  <link rel="canonical" href="https://www.anaua.com.br/experiencias.html" />
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/listing.css" />
</head>
<body class="is-loading">
  <div id="header-placeholder"></div>

  <!-- PAGE HEADER -->
  <header class="page-header" aria-labelledby="page-title">
    <div class="container">
      <p class="page-header__eyebrow">Catálogo completo</p>
      <h1 class="page-header__title" id="page-title">Experiências</h1>
      <p class="page-header__desc">
        Escolha pelo tipo de aventura, destino ou dificuldade.
        Temos vagas limitadas — reserve com antecedência.
      </p>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filters" id="filters-bar" aria-label="Filtrar experiências">
    <div class="container">
      <div class="filters__inner" role="group" aria-label="Categorias">
        <button class="filter-chip is-active" data-filter="all" aria-pressed="true">
          🌿 Todas
        </button>
        <button class="filter-chip" data-filter="day-experience" aria-pressed="false">
          ☀️ 1 dia
        </button>
        <button class="filter-chip" data-filter="expedition" aria-pressed="false">
          🗺️ Expedições
        </button>
        <button class="filter-chip" data-filter="event" aria-pressed="false">
          ✨ Eventos
        </button>
        <button class="filter-chip" data-filter="kids" aria-pressed="false">
          🌱 Kids
        </button>
        <div class="filters__sep" aria-hidden="true" style="width:1px;height:24px;background:var(--color-stone);flex-shrink:0"></div>
        <button class="filter-chip" data-filter="iniciante" data-type="difficulty" aria-pressed="false">
          Iniciante
        </button>
        <button class="filter-chip" data-filter="moderado" data-type="difficulty" aria-pressed="false">
          Moderado
        </button>
        <button class="filter-chip" data-filter="aventura" data-type="difficulty" aria-pressed="false">
          Aventura
        </button>
      </div>
    </div>
  </div>

  <!-- LISTING MAIN -->
  <main class="section" id="main-content">
    <div class="container">
      <div class="listing-toolbar">
        <p class="listing-count" id="results-count" aria-live="polite"></p>
        <div class="listing-sort">
          <label for="sort-select" class="sr-only">Ordenar por</label>
          <select id="sort-select" class="select" style="max-width:200px">
            <option value="featured">Em destaque</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
            <option value="name">Nome A–Z</option>
          </select>
        </div>
      </div>

      <div class="grid-cards" id="listing-grid" aria-live="polite" aria-busy="true">
        <!-- JS injeta -->
      </div>

      <!-- Pagination placeholder -->
      <div id="pagination" class="listing-pagination"></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <!-- Supabase JS v2 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="assets/js/listing.js?v=20260505"></script>
</body>
</html>
