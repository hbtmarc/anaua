<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title id="page-title-meta">Detalhes — Anauá Ecoturismo</title>
  <meta name="description" id="page-desc-meta" content="Detalhes da experiência na Anauá Ecoturismo." />
  <!-- Open Graph (updated dynamically by detail.js) -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Anauá Ecoturismo" />
  <meta property="og:url"         id="og-url"   content="https://www.anaua.com.br/experiencia.html" />
  <meta property="og:title"       id="og-title" content="Detalhes — Anauá Ecoturismo" />
  <meta property="og:description" id="og-desc"  content="Detalhes da experiência na Anauá Ecoturismo." />
  <meta property="og:image"       id="og-image" content="https://www.anaua.com.br/assets/img/og-experiencias.jpg" />
  <meta property="og:locale"      content="pt_BR" />
  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       id="tw-title" content="Detalhes — Anauá Ecoturismo" />
  <meta name="twitter:image"       id="tw-image" content="https://www.anaua.com.br/assets/img/og-experiencias.jpg" />
  <!-- Canonical (updated dynamically) -->
  <link rel="canonical" id="canonical" href="https://www.anaua.com.br/experiencia.html" />
  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/detail.css" />
</head>
<body class="is-loading">
  <div id="header-placeholder"></div>

  <!-- BREADCRUMB -->
  <div class="container" id="breadcrumb-container" aria-label="Navegação"></div>

  <!-- DETAIL HERO -->
  <div id="detail-hero" class="detail-hero" aria-label="Imagem de destaque"></div>

  <!-- MAIN LAYOUT -->
  <main class="section" id="detail-main">
    <div class="container">
      <div class="detail-layout">

        <!-- LEFT COLUMN -->
        <div class="detail-content" id="detail-content">
          <!-- JS injeta tudo aqui -->
          <div class="skeleton" style="height:40px;width:60%;border-radius:var(--radius-md)"></div>
          <div class="skeleton" style="height:20px;width:80%;margin-top:12px;border-radius:var(--radius-md)"></div>
          <div class="skeleton" style="height:120px;margin-top:24px;border-radius:var(--radius-md)"></div>
        </div>

        <!-- RIGHT COLUMN — booking box -->
        <aside class="detail-sidebar" aria-label="Reserva">
          <div class="booking-box" id="booking-box">
            <div class="skeleton" style="height:80px;border-radius:var(--radius-md)"></div>
            <div class="skeleton" style="height:44px;border-radius:var(--radius-md)"></div>
            <div class="skeleton" style="height:44px;border-radius:var(--radius-md)"></div>
            <div class="skeleton" style="height:48px;border-radius:var(--radius-md)"></div>
          </div>
        </aside>
      </div>

      <!-- RELATED -->
      <section class="section section--sm" aria-labelledby="related-heading" id="related-section" style="padding-inline:0">
        <div class="section-header" data-animate>
          <p class="section-header__eyebrow">Você também pode gostar</p>
          <h2 class="section-header__title" id="related-heading">Outras experiências</h2>
        </div>
        <div class="grid-cards grid-cards--3" id="related-grid"></div>
      </section>
    </div>
  </main>

  <!-- STICKY CTA (mobile) -->
  <div class="sticky-cta" id="sticky-cta" aria-label="Botão de reserva fixo">
    <div class="sticky-cta__price">
      <span class="sticky-cta__from">a partir de</span>
      <span class="sticky-cta__value" id="sticky-price">—</span>
    </div>
    <a href="#booking-box" class="btn btn--primary btn--lg" id="sticky-reserve-btn">
      Reservar vaga
    </a>
  </div>

  <!-- GALLERY MODAL -->
  <div id="gallery-modal-container"></div>

  <div id="footer-placeholder"></div>
  <script type="module" src="assets/js/detail.js"></script>
</body>
</html>
