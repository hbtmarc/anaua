<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Área do Cliente — Anauá Ecoturismo</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/cliente.css" />
</head>
<body>
  <header id="site-header"></header>

  <main>
    <!-- Login view -->
    <div id="login-view" class="login-wrap">
      <div class="login-card animate-fade-in-up">
        <div class="login-card__brand">Anauá</div>
        <p class="login-card__sub">Entre para acessar suas reservas</p>

        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label class="label" for="login-email">E-mail</label>
            <input
              class="input"
              type="email"
              id="login-email"
              name="email"
              autocomplete="email"
              placeholder="seu@email.com"
              required
            />
            <span class="field-error" id="login-email-err" role="alert"></span>
          </div>

          <div class="field">
            <label class="label" for="login-password">Senha</label>
            <input
              class="input"
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <span class="field-error" id="login-password-err" role="alert"></span>
          </div>

          <button type="submit" class="btn btn--primary btn--full" id="login-btn">
            Entrar
          </button>

          <span class="field-error" id="login-global-err" role="alert" style="justify-content:center;margin-top:var(--sp-3)"></span>
        </form>

        <div class="login-card__footer">
          Não tem conta?
          <a href="contato.html">Fale conosco</a>
          &nbsp;·&nbsp;
          <a href="index.html">Voltar ao site</a>
        </div>
      </div>
    </div>

    <!-- Dashboard view (hidden until login) -->
    <div id="dashboard-view" class="dashboard">

      <!-- Hero / profile bar -->
      <div class="dash-hero">
        <div class="container">
          <div class="dash-hero__inner">
            <div class="dash-hero__left">
              <div class="dash-avatar" id="user-avatar" aria-hidden="true">A</div>
              <div>
                <p class="dash-hero__greeting">Bem-vindo(a) de volta</p>
                <p class="dash-hero__name">Olá, <em id="user-name">visitante</em>!</p>
                <p class="dash-hero__email" id="user-email"></p>
              </div>
            </div>
            <div class="dash-hero__actions">
              <a id="backoffice-link" href="admin/index.html"
                 class="btn--backoffice"
                 style="display:none">
                ⚙ Backoffice
              </a>
              <button class="btn--logout" id="logout-btn">Sair</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Reservations -->
      <section class="dash-section">
        <div class="container">
          <div class="dash-section__header">
            <h2 class="dash-section__title">Minhas Reservas</h2>
            <span class="dash-section__count" id="resa-count" style="display:none"></span>
          </div>
          <div id="reservation-list" class="resa-list">
            <!-- populated by cliente.js -->
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer id="site-footer"></footer>
  <!-- Supabase JS v2 via CDN -->
  <script>
    // Defesa: remover credenciais da URL antes de qualquer script carregar
    (function() {
      if (/[?&](password|senha|email)=/i.test(location.search)) {
        console.warn('[security] Dados sensíveis removidos da URL');
        history.replaceState(null, '', location.pathname + location.hash);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="assets/js/cliente.js"></script>
</body>
</html>
